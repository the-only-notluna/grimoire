<!DOCTYPE html>
<html lang="fr">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
	<title>Grimoire de la Compagnie Qui Cherche Son Nom</title>
	
	<script src="data/dungrow.js"></script>
	<script src="data/wes.js"></script>
	<style>
		:root {
			--bg: #1a1a1a;
			--card-bg: #2d2d2d;
			--text: #e0e0e0;
			/* La couleur accent sera définie dynamiquement par le JS */
			--accent: #d4af37; 
			--danger: #ff4d4d;
			--success: #4caf50;
			--font: -apple-system, system-ui, sans-serif;
		}

		body {
			font-family: var(--font);
			background-color: var(--bg);
			color: var(--text);
			margin: 0; padding: 0;
			-webkit-tap-highlight-color: transparent;
			overflow-x: hidden;
		}

		/* HEADER DYNAMIQUE */
		header {
			background: #111;
			padding: 15px;
			text-align: center;
			border-bottom: 2px solid var(--accent);
			position: sticky; top: 0; z-index: 100;
			display: flex; justify-content: space-between; align-items: center;
		}
		.header-title { margin: 0; font-size: 1.1rem; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; flex-grow: 1; }
		.home-btn { font-size: 1.2rem; text-decoration: none; cursor: pointer; color: var(--text); visibility: hidden; }
		.home-btn.visible { visibility: visible; }

		.container { padding: 15px; max-width: 600px; margin: auto; padding-bottom: 60px; }

		/* ÉCRAN 0 : HUB DE SÉLECTION */
		.char-grid {
			display: grid;
			grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
			gap: 15px;
			margin-top: 20px;
		}
		.char-card {
			background: var(--card-bg);
			border: 1px solid #444;
			border-radius: 12px;
			padding: 20px;
			text-align: center;
			cursor: pointer;
			transition: transform 0.2s, border-color 0.2s;
		}
		.char-card:active { transform: scale(0.98); }
		/* L'avatar est géré ici */
		.avatar-frame {
			width: 80px; height: 80px;
			margin: 0 auto 15px auto;
			border-radius: 50%;
			background: #111;
			border: 2px solid transparent;
			overflow: hidden;
			display: flex; align-items: center; justify-content: center;
			font-size: 2rem; color: #555;
		}
		.avatar-img { width: 100%; height: 100%; object-fit: cover; display: none; }
		/* Classe pour activer l'image si présente */
		.has-image .avatar-img { display: block; }
		.has-image .avatar-placeholder { display: none; }
		
		.char-name { font-weight: bold; font-size: 1.1rem; margin-bottom: 5px; color: var(--text); }
		.char-class { font-size: 0.8rem; color: #888; text-transform: uppercase; letter-spacing: 1px; }

		/* MOTEUR DE RECHERCHE */
		.search-wrapper {
			position: relative; margin-bottom: 10px; background: #f1f1f1;
			border-radius: 25px; display: flex; align-items: center; padding: 8px 15px;
		}
		.search-icon { color: #8e8e93; font-size: 18px; margin-right: 10px; }
		#search-input { flex: 1; border: none; background: transparent; height: 30px; font-size: 1rem; outline: none; color: #333; }
		.clear-search { color: #8e8e93; font-size: 20px; cursor: pointer; padding: 0 5px; visibility: hidden; }

		/* RESET */
		.global-reset-container { margin-bottom: 20px; text-align: right; }
		.btn-global-reset {
			background: transparent; color: var(--danger); border: 1px solid var(--danger);
			padding: 6px 12px; border-radius: 20px; font-size: 0.7rem; font-weight: bold;
			text-transform: uppercase; cursor: pointer;
		}

		/* ÉCRANS & NAVIGATION */
		.screen { display: none; }
		.screen.active { display: block; animation: fadeIn 0.2s ease-out; }
		@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

		/* BOUTONS GÉNÉRIQUES */
		.btn {
			background: var(--card-bg); border: 1px solid #444; color: var(--text);
			padding: 16px; margin-bottom: 8px; border-radius: 12px; display: block;
			text-decoration: none; font-size: 1rem; text-align: left; width: 100%; box-sizing: border-box;
		}
		.btn:active { opacity: 0.7; }
		.back-link { color: var(--accent); display: inline-block; margin-bottom: 15px; text-decoration: none; font-weight: bold; padding: 10px 0; cursor: pointer; }

		/* CONTENU DIALOGUES */
		h2 { font-size: 1.4rem; color: var(--text); margin: 10px 0; line-height: 1.4; font-weight: 900; }
		.breadcrumb-item { cursor: pointer; transition: color 0.2s; }
		.breadcrumb-item:hover { color: var(--accent); text-decoration: underline; }
		
		.meta { font-size: 0.85rem; color: #aaa; margin-bottom: 15px; background: #222; padding: 12px; border-radius: 8px; line-height: 1.5; border: 1px solid #333; }
		.scenic { font-style: italic; border-left: 4px solid var(--accent); padding-left: 15px; margin: 20px 0; color: #bbb; line-height: 1.6; }
		.dialogue-text {
			font-size: 1.15rem; line-height: 1.6; background: #000; padding: 20px;
			border-radius: 12px; border: 1px solid #444; white-space: pre-wrap; color: #fff;
		}
		.category-title { color: var(--accent); font-size: 0.75rem; text-transform: uppercase; margin: 25px 0 10px 5px; letter-spacing: 2px; font-weight: 800; }

		/* ACTION BAR & LOGS */
		.action-bar { display: flex; gap: 12px; margin-top: 30px; margin-bottom: 25px; }
		.btn-validate { background: var(--success); color: white; flex: 2; text-align: center; font-weight: bold; border: none; }
		.btn-cancel { background: var(--danger); color: white; flex: 1; text-align: center; border: none; }
		.log-section { border-top: 1px solid #444; padding-top: 15px; font-size: 0.85rem; color: #888; }
		.log-title { color: var(--accent); font-weight: bold; margin-bottom: 8px; display: block; text-transform: uppercase; font-size: 0.7rem; }
		.log-entry { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; border-bottom: 1px solid #222; padding-bottom: 6px; }
		.btn-delete-log { background: var(--danger); color: white; border: none; padding: 4px 8px; border-radius: 4px; font-size: 0.7rem; font-weight: bold; cursor: pointer; }

		/* MODAL */
		#modal-overlay {
			position: fixed; top:0; left:0; width:100%; height:100%;
			background: rgba(0,0,0,0.85); z-index: 1000;
			display: none; align-items: center; justify-content: center; backdrop-filter: blur(3px);
		}
		.modal-box {
			background: #222; width: 85%; max-width: 350px;
			padding: 25px; border-radius: 15px; border: 1px solid var(--accent); text-align: center;
		}
		.modal-msg { margin-bottom: 20px; font-size: 1rem; line-height: 1.4; color: white; }
		.modal-btns { display: flex; gap: 10px; }
		.m-btn { flex: 1; padding: 12px; border-radius: 8px; border: none; font-weight: bold; }
		.m-cancel { background: #444; color: white; }
		.m-confirm { background: var(--accent); color: black; }
		.m-danger { background: var(--danger); color: white; }

		.counter { float: right; color: var(--accent); font-weight: bold; font-family: monospace; }
		.hidden { display: none; }
	</style>
</head>
<body>

<header>
	<div id="home-btn" class="home-btn" onclick="goToHub()">🏠</div>
	<h1 id="app-title" class="header-title">Grimoire</h1>
	<div style="width: 24px;"></div> </header>

<div class="container">
	<div id="screen-0" class="screen active">
		<div id="char-list" class="char-grid"></div>
	</div>

	<div id="screen-1" class="screen">
		<div class="search-wrapper">
			<span class="search-icon">🔍</span>
			<input type="text" id="search-input" placeholder="Rechercher un sort..." oninput="filterSpells()">
			<span id="clear-btn" class="clear-search" onclick="clearSearch()">✕</span>
		</div>
		
		<div class="global-reset-container">
			<button class="btn-global-reset" onclick="confirmGlobalReset()">Réinitialiser ce Perso</button>
		</div>

		<div id="spell-list"></div>
	</div>

	<div id="screen-2" class="screen">
		<h2 id="s2-title"></h2>
		<div id="s2-meta" class="meta"></div>
		<div id="outcome-list"></div>
		<a class="back-link" onclick="showScreen(1)">← Retour</a>
	</div>

	<div id="screen-3" class="screen">
		<h2 id="s3-title"></h2>
		<div id="s3-meta" class="meta"></div>
		<div id="dialogue-types"></div>
		<a id="back-to-s2" class="back-link">← Retour</a>
	</div>

	<div id="screen-4" class="screen">
		<h2 id="s4-title"></h2>
		<div id="s4-meta" class="meta"></div>
		<div id="s4-scenic" class="scenic"></div>
		<div id="s4-text" class="dialogue-text"></div>
		<div class="action-bar">
			<button class="btn btn-cancel" onclick="showScreen(3)">Annuler</button>
			<button class="btn btn-validate" onclick="confirmValidation()">Valider</button>
		</div>
		<div class="log-section">
			<span class="log-title">Derniers usages :</span>
			<div id="s4-logs"></div>
		</div>
		<a class="back-link" onclick="showScreen(3)">← Retour</a>
	</div>
</div>

<div id="modal-overlay">
	<div class="modal-box">
		<div id="modal-msg" class="modal-msg"></div>
		<div class="modal-btns">
			<button class="m-btn m-cancel" onclick="closeModal()">ANNULER</button>
			<button id="modal-confirm-btn" class="m-btn">VALIDER</button>
		</div>
	</div>
</div>

<script>
	/* --- GESTION DES DONNÉES GLOBALES --- */
	const allCharacters = window.GrimoireData || {};
	
	let activeCharKey = null; 
	let activeCharData = null; 
	let currentSpell, currentOutcome, currentDiag;

	let counts = {};
	let logs = {};

	/* --- NAVIGATION HUB & INIT --- */
	function initHub() {
		const grid = document.getElementById('char-list');
		grid.innerHTML = '';

		Object.keys(allCharacters).forEach(key => {
			const char = allCharacters[key];
			if (!char.grimoire || char.grimoire.length === 0) return;

			const card = document.createElement('div');
			card.className = 'char-card';
			card.style.borderColor = "#444"; 

			const hasImage = char.avatar && char.avatar.length > 0;
			const avatarClass = hasImage ? 'avatar-frame has-image' : 'avatar-frame';
			const imgPath = hasImage ? char.avatar : '';
			
			card.innerHTML = `
				<div class="${avatarClass}" style="border-color:${char.color}">
					<span class="avatar-placeholder">👤</span>
					<img src="${imgPath}" class="avatar-img" alt="${char.displayName}">
				</div>
				<div class="char-name" style="color:${char.color}">${char.displayName}</div>
				<div class="char-class">${char.job}</div>
			`;
			
			card.onclick = () => selectCharacter(key);
			grid.appendChild(card);
		});
	}

	function selectCharacter(key) {
		activeCharKey = key;
		activeCharData = allCharacters[key];
		document.documentElement.style.setProperty('--accent', activeCharData.color);
		document.getElementById('app-title').innerText = `Grimoire de ${activeCharData.displayName}`;
		document.getElementById('home-btn').classList.add('visible');
		loadCharData();
		renderScreen1();
		showScreen(1);
	}

	function goToHub() {
		activeCharKey = null;
		activeCharData = null;
		document.getElementById('app-title').innerText = "Grimoire";
		document.getElementById('home-btn').classList.remove('visible');
		document.documentElement.style.setProperty('--accent', '#d4af37');
		showScreen(0);
	}

	function loadCharData() {
		counts = JSON.parse(localStorage.getItem(activeCharKey + '_counts') || '{}');
		logs = JSON.parse(localStorage.getItem(activeCharKey + '_logs') || '{}');
	}

	function saveCharData() {
		localStorage.setItem(activeCharKey + '_counts', JSON.stringify(counts));
		localStorage.setItem(activeCharKey + '_logs', JSON.stringify(logs));
	}

	/* --- UTILITAIRES --- */
	function getCommonMetaHTML() {
		return `<strong>${currentSpell.type}</strong> | ${currentSpell.mechanic}`;
	}

	function getEmoji(txt) {
		const t = txt.toLowerCase();
		if(t.includes("échec critique")) return "☠️";
		if(t.includes("échec")) return "😰";
		if(t.includes("succès critique")) return "😎";
		if(t.includes("succès")) return "🥳";
		return "✨";
	}

	/* --- LOGIQUE DE RENDU --- */
	
	function renderScreen1() {
		document.getElementById('app-title').innerText = `Grimoire de ${activeCharData.displayName}`;
		const list = document.getElementById('spell-list');
		list.innerHTML = '';
		activeCharData.grimoire.forEach(cat => {
			const group = document.createElement('div');
			group.className = 'spell-group';
			group.innerHTML = `<div class="category-title">${cat.category}</div>`;
			cat.spells.forEach(s => {
				const b = document.createElement('button');
				b.className = 'btn spell-btn';
				b.dataset.name = s.name.toLowerCase();
				b.innerText = s.name;
				b.onclick = () => { 
					currentSpell = s; 
					s.outcomes.length > 1 ? renderScreen2() : selectOutcome(s.outcomes[0]); 
				};
				group.appendChild(b);
			});
			list.appendChild(group);
		});
	}

	function renderScreen2() {
		// Écran 2 (Outcomes) : Nom du Sort -> Retour à l'écran 1
		document.getElementById('s2-title').innerHTML = `
			<span class="breadcrumb-item" onclick="showScreen(1)">${currentSpell.name}</span>
		`;
		document.getElementById('s2-meta').innerHTML = getCommonMetaHTML();
		
		const list = document.getElementById('outcome-list');
		list.innerHTML = '';
		currentSpell.outcomes.forEach(o => {
			const b = document.createElement('button');
			b.className = 'btn';
			b.innerHTML = `${getEmoji(o.result)}&nbsp;${o.result}`;
			b.onclick = () => selectOutcome(o);
			list.appendChild(b);
		});
		showScreen(2);
	}

	function selectOutcome(o) { currentOutcome = o; renderScreen3(); }

	function renderScreen3() {
		// Écran 3 (Types) : Nom du Sort (E1) > Réussite (E2)
		document.getElementById('s3-title').innerHTML = `
			<span class="breadcrumb-item" onclick="showScreen(1)">${currentSpell.name}</span> > 
			<span class="breadcrumb-item" onclick="renderScreen2()">${getEmoji(currentOutcome.result)}&nbsp;${currentOutcome.result}</span>
		`;
		document.getElementById('s3-meta').innerHTML = getCommonMetaHTML();
		
		document.getElementById('back-to-s2').onclick = () => currentSpell.outcomes.length > 1 ? showScreen(2) : showScreen(1);
		
		const list = document.getElementById('dialogue-types');
		list.innerHTML = '';
		
		const dialogueKeys = Object.keys(currentOutcome.dialogues);
		dialogueKeys.forEach(k => {
			const ck = `${currentSpell.id}_${k}`;
			const b = document.createElement('button');
			b.className = 'btn';
			let emoji = "💬";
			if(activeCharData.emojiMap && activeCharData.emojiMap[k]) emoji = activeCharData.emojiMap[k];
			
			b.innerHTML = `<span class="counter">[${counts[ck] || 0}]</span> ${emoji}&nbsp;${k}`;
			b.onclick = () => { currentDiag = k; renderScreen4(); };
			list.appendChild(b);
		});
		showScreen(3);
	}

	function renderScreen4() {
		const ck = `${currentSpell.id}_${currentDiag}`;
		let emoji = "💬";
		if(activeCharData.emojiMap && activeCharData.emojiMap[currentDiag]) emoji = activeCharData.emojiMap[currentDiag];

		// Écran 4 (Texte) : Nom du Sort (E1) > Réussite (E2) > Dialogue (E3) [nb usage]
		document.getElementById('s4-title').innerHTML = `
			<span class="breadcrumb-item" onclick="showScreen(1)">${currentSpell.name}</span> > 
			<span class="breadcrumb-item" onclick="renderScreen2()">${getEmoji(currentOutcome.result)}&nbsp;${currentOutcome.result}</span> > 
			<span class="breadcrumb-item" onclick="renderScreen3()">${emoji}&nbsp;${currentDiag}</span> [${counts[ck] || 0}]
		`;
		document.getElementById('s4-meta').innerHTML = getCommonMetaHTML();
		
		document.getElementById('s4-scenic').innerText = currentOutcome.scenic_attitude;
		document.getElementById('s4-text').innerText = currentOutcome.dialogues[currentDiag];
		
		const logBox = document.getElementById('s4-logs');
		logBox.innerHTML = '';
		const history = logs[ck] || [];
		if(history.length === 0) { logBox.innerHTML = '<span>Aucun usage.</span>'; } 
		else {
			[...history].reverse().forEach((d, idx) => {
				const realIndex = history.length - 1 - idx;
				const row = document.createElement('div');
				row.className = 'log-entry';
				row.innerHTML = `<span>le ${d}</span><button class="btn-delete-log" onclick="confirmDeleteLog('${ck}', ${realIndex})">EFFACER</button>`;
				logBox.appendChild(row);
			});
		}
		showScreen(4);
	}

	function showScreen(n) {
		document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
		document.getElementById('screen-'+n).classList.add('active');
		window.scrollTo(0,0);
	}

	function filterSpells() {
		const q = document.getElementById('search-input').value.toLowerCase();
		document.getElementById('clear-btn').style.visibility = q.length > 0 ? 'visible' : 'hidden';
		document.querySelectorAll('.spell-btn').forEach(b => b.classList.toggle('hidden', !b.dataset.name.includes(q)));
		document.querySelectorAll('.spell-group').forEach(g => {
			const hasVisible = g.querySelectorAll('.spell-btn:not(.hidden)').length > 0;
			g.classList.toggle('hidden', !hasVisible);
		});
	}
	
	function clearSearch() { document.getElementById('search-input').value = ''; filterSpells(); }

	/* --- MODALS & ACTIONS --- */
	function openModal(msg, confirmCallback, isDanger = false) {
		const overlay = document.getElementById('modal-overlay');
		const msgDiv = document.getElementById('modal-msg');
		const confirmBtn = document.getElementById('modal-confirm-btn');
		msgDiv.innerText = msg;
		confirmBtn.className = isDanger ? 'm-btn m-danger' : 'm-btn m-confirm';
		overlay.style.display = 'flex';
		confirmBtn.onclick = () => { confirmCallback(); closeModal(); };
	}
	function closeModal() { document.getElementById('modal-overlay').style.display = 'none'; }

	function confirmValidation() { openModal("Avez-vous bien fini de lire le texte ?", validateAction); }
	
	function validateAction() {
		const ck = `${currentSpell.id}_${currentDiag}`;
		counts[ck] = (counts[ck] || 0) + 1;
		const now = new Date().toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' });
		if(!logs[ck]) logs[ck] = [];
		logs[ck].push(now);
		saveCharData(); 
		renderScreen3();
	}

	function confirmDeleteLog(ck, index) {
		openModal("Supprimer cette entrée ?", () => {
			logs[ck].splice(index, 1);
			if (counts[ck] > 0) counts[ck]--;
			saveCharData();
			renderScreen4();
		}, true);
	}

	function confirmGlobalReset() {
		openModal(`Réinitialiser TOUT pour ${activeCharData.displayName} ?`, resetCharData, true);
	}

	function resetCharData() {
		counts = {};
		logs = {};
		localStorage.removeItem(activeCharKey + '_counts');
		localStorage.removeItem(activeCharKey + '_logs');
		renderScreen1();
	}

	initHub();

</script>
</body>
</html>
