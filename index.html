<!DOCTYPE html>
<html lang="fr">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
	<title>Dungrow Grimoire L06</title>
	<style>
		:root {
			--bg: #1a1a1a;
			--card-bg: #2d2d2d;
			--text: #e0e0e0;
			--accent: #d4af37;
			--danger: #ff4d4d;
			--success: #4caf50;
			--font: -apple-system, system-ui, sans-serif;
		}

		body {
			font-family: var(--font);
			background-color: var(--bg);
			color: var(--text);
			margin: 0; padding: 0;
			-webkit-tap-highlight-color: transparent;
			overflow-x: hidden;
		}

		header {
			background: #111;
			padding: 15px;
			text-align: center;
			border-bottom: 2px solid var(--accent);
			position: sticky; top: 0; z-index: 100;
		}

		h1 { margin: 0; font-size: 1.1rem; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; }
		
		.container { padding: 15px; max-width: 600px; margin: auto; padding-bottom: 60px; }

		/* MOTEUR DE RECHERCHE */
		.search-wrapper {
			position: relative;
			margin-bottom: 10px;
			background: #f1f1f1;
			border-radius: 25px;
			display: flex;
			align-items: center;
			padding: 8px 15px;
		}
		.search-icon { color: #8e8e93; font-size: 18px; margin-right: 10px; }
		#search-input { flex: 1; border: none; background: transparent; height: 30px; font-size: 1rem; outline: none; color: #333; }
		.clear-search { color: #8e8e93; font-size: 20px; cursor: pointer; padding: 0 5px; visibility: hidden; }

		/* BOUTON RESET GLOBAL */
		.global-reset-container { margin-bottom: 20px; text-align: right; }
		.btn-global-reset {
			background: transparent;
			color: var(--danger);
			border: 1px solid var(--danger);
			padding: 6px 12px;
			border-radius: 20px;
			font-size: 0.7rem;
			font-weight: bold;
			text-transform: uppercase;
			cursor: pointer;
		}

		/* ECRANS */
		.screen { display: none; }
		.screen.active { display: block; animation: fadeIn 0.2s ease-out; }
		@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

		/* BOUTONS */
		.btn {
			background: var(--card-bg);
			border: 1px solid #444;
			color: var(--text);
			padding: 16px;
			margin-bottom: 8px;
			border-radius: 12px;
			display: block;
			text-decoration: none;
			font-size: 1rem;
			text-align: left;
			width: 100%;
			box-sizing: border-box;
		}
		.btn:active { opacity: 0.7; }

		.back-link { color: var(--accent); display: inline-block; margin-bottom: 15px; text-decoration: none; font-weight: bold; padding: 10px 0; }

		/* TEXTES ET META */
		.meta { font-size: 0.85rem; color: #aaa; margin-bottom: 15px; background: #222; padding: 12px; border-radius: 8px; line-height: 1.5; border: 1px solid #333; }
		.outcome-tag { color: var(--accent); font-weight: bold; margin-bottom: 5px; display: block; font-size: 1rem; }
		
		.scenic { font-style: italic; border-left: 4px solid var(--accent); padding-left: 15px; margin: 20px 0; color: #bbb; line-height: 1.6; }

		.dialogue-text {
			font-size: 1.15rem;
			line-height: 1.6;
			background: #000;
			padding: 20px;
			border-radius: 12px;
			border: 1px solid #444;
			white-space: pre-wrap;
			color: #fff;
		}

		.category-title { color: var(--accent); font-size: 0.75rem; text-transform: uppercase; margin: 25px 0 10px 5px; letter-spacing: 2px; font-weight: 800; }

		.action-bar { display: flex; gap: 12px; margin-top: 30px; margin-bottom: 25px; }
		.btn-validate { background: var(--success); color: white; flex: 2; text-align: center; font-weight: bold; border: none; }
		.btn-cancel { background: var(--danger); color: white; flex: 1; text-align: center; border: none; }

		/* LOGS SECTION */
		.log-section { border-top: 1px solid #444; padding-top: 15px; font-size: 0.85rem; color: #888; }
		.log-title { color: var(--accent); font-weight: bold; margin-bottom: 8px; display: block; text-transform: uppercase; font-size: 0.7rem; }
		.log-entry { 
			display: flex; justify-content: space-between; align-items: center; 
			margin-bottom: 6px; border-bottom: 1px solid #222; padding-bottom: 6px; 
		}
		.btn-delete-log {
			background: var(--danger); color: white; border: none; padding: 4px 8px;
			border-radius: 4px; font-size: 0.7rem; font-weight: bold; cursor: pointer;
		}

		/* POP-IN (MODAL) */
		#modal-overlay {
			position: fixed; top:0; left:0; width:100%; height:100%;
			background: rgba(0,0,0,0.85); z-index: 1000;
			display: none; align-items: center; justify-content: center;
			backdrop-filter: blur(3px);
		}
		.modal-box {
			background: #222; width: 85%; max-width: 350px;
			padding: 25px; border-radius: 15px; border: 1px solid var(--accent);
			text-align: center;
		}
		.modal-msg { margin-bottom: 20px; font-size: 1rem; line-height: 1.4; color: white; }
		.modal-btns { display: flex; gap: 10px; }
		.m-btn { flex: 1; padding: 12px; border-radius: 8px; border: none; font-weight: bold; }
		.m-cancel { background: #444; color: white; }
		.m-confirm { background: var(--accent); color: black; }
		.m-danger { background: var(--danger); color: white; }

		.counter { float: right; color: var(--accent); font-weight: bold; font-family: monospace; }
		.hidden { display: none; }
	</style>
</head>
<body>

<header><h1>Dungrow : Grimoire L06</h1></header>

		<div class="global-reset-container">

		<div id="outcome-list"></div>
	</div>

	<div id="screen-3" class="screen">

		<div class="action-bar">

		</div>
		<div class="log-section">

			<div id="s4-logs"></div>
		</div>
	</div>
</div>

<div id="modal-overlay">
	<div class="modal-box">
		<div id="modal-msg" class="modal-msg"></div>
		<div class="modal-btns">
			<button class="m-btn m-cancel" onclick="closeModal()">ANNULER</button>
			<button id="modal-confirm-btn" class="m-btn">VALIDER</button>
		</div>
	</div>
</div>

							},
							{
								"result": "Échec (Les Soins Sont Insuffisants)",
								"scenic_attitude": "Je presse le bandage sur la plaie, applique l’onguent avec soin, mais le résultat est décevant. Le saignement ralentit à peine, la douleur persiste. Je fronce les sourcils, ma mâchoire se crispe. Mes mains continuent machinalement, mais mon regard trahit la frustration. Je secoue la tête, mécontent du résultat. Ma voix prend un ton défensif. L’air reste tendu — les soins ne suffisent pas. Me voyant faire, tous comprennent que je fais ce que je peux, mais que ce n’est manifestement pas assez.",

							},
							{

					},

	function openModal(msg, confirmCallback, isDanger = false) {
		const overlay = document.getElementById('modal-overlay');
		const msgDiv = document.getElementById('modal-msg');
		const confirmBtn = document.getElementById('modal-confirm-btn');
		msgDiv.innerText = msg;
		confirmBtn.className = isDanger ? 'm-btn m-danger' : 'm-btn m-confirm';
		overlay.style.display = 'flex';
		confirmBtn.onclick = () => { confirmCallback(); closeModal(); };
	}

	function closeModal() { document.getElementById('modal-overlay').style.display = 'none'; }

	function showScreen(n) {
		document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
		document.getElementById('screen-'+n).classList.add('active');
		window.scrollTo(0,0);
	}

	function clearSearch() { document.getElementById('search-input').value = ''; filterSpells(); }

	function filterSpells() {
		const q = document.getElementById('search-input').value.toLowerCase();
		document.getElementById('clear-btn').style.visibility = q.length > 0 ? 'visible' : 'hidden';
		document.querySelectorAll('.spell-btn').forEach(b => b.classList.toggle('hidden', !b.dataset.name.includes(q)));
		document.querySelectorAll('.spell-group').forEach(g => {
			const hasVisible = g.querySelectorAll('.spell-btn:not(.hidden)').length > 0;
			g.classList.toggle('hidden', !hasVisible);
		});
	}

	function renderScreen1() {
		const list = document.getElementById('spell-list');
		list.innerHTML = '';
		fullData.grimoire.forEach(cat => {
			const group = document.createElement('div');
			group.className = 'spell-group';
			group.innerHTML = `<div class="category-title">${cat.category}</div>`;
			cat.spells.forEach(s => {
				const b = document.createElement('button');
				b.className = 'btn spell-btn';
				b.dataset.name = s.name.toLowerCase();
				b.innerText = s.name;
				b.onclick = () => { currentSpell = s; s.outcomes.length > 1 ? renderScreen2() : selectOutcome(s.outcomes[0]); };
				group.appendChild(b);
			});
			list.appendChild(group);
		});
	}

		if(t.includes("échec")) return "😰";
		if(t.includes("succès critique")) return "😎";
		if(t.includes("succès")) return "🥳";
		return "✨";
	}

		document.getElementById('s4-text').innerText = currentOutcome.dialogues[currentDiag];
		
		const logBox = document.getElementById('s4-logs');
		logBox.innerHTML = '';
		const history = logs[ck] || [];
		if(history.length === 0) { logBox.innerHTML = '<span>Aucun usage.</span>'; } 
		else {
			[...history].reverse().forEach((d, idx) => {
				const realIndex = history.length - 1 - idx;
				const row = document.createElement('div');
				row.className = 'log-entry';
				row.innerHTML = `<span>le ${d}</span><button class="btn-delete-log" onclick="confirmDeleteLog('${ck}', ${realIndex})">EFFACER</button>`;
				logBox.appendChild(row);
			});
		}
		showScreen(4);
	}
	
	function confirmValidation() { openModal("Avez-vous bien fini de lire le texte ?", validateAction); }

	function validateAction() {
		const ck = `${currentSpell.id}_${currentDiag}`;
		counts[ck] = (counts[ck] || 0) + 1;
		localStorage.setItem('dungrow_counts', JSON.stringify(counts));
		const now = new Date().toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit' });
		if(!logs[ck]) logs[ck] = [];
		logs[ck].push(now);
		localStorage.setItem('dungrow_logs', JSON.stringify(logs));
		renderScreen3();
	}

	function confirmDeleteLog(ck, index) {
		openModal("Cette action est irréversible, souhaitez-vous continuer ?", () => {
			logs[ck].splice(index, 1);
			localStorage.setItem('dungrow_logs', JSON.stringify(logs));
			if (counts[ck] > 0) counts[ck]--;
			localStorage.setItem('dungrow_counts', JSON.stringify(counts));
			renderScreen4();
		}, true);
	}

	// NOUVELLE FONCTION RESET GLOBAL
	function confirmGlobalReset() {
		openModal("Attention : Cette action est irréversible. Souhaitez-vous réinitialiser TOUS les compteurs et l'historique ?", resetAllData, true);
	}

	function resetAllData() {
		counts = {};
		logs = {};
		localStorage.removeItem('dungrow_counts');
		localStorage.removeItem('dungrow_logs');
		renderScreen1();
		alert("Le grimoire a été remis à zéro.");
	}

	renderScreen1();
</script>
</body>
</html>
